name: Release

# A pushed version tag (v1.2.3) builds the source distribution and the wheel and publishes them
# as a GitHub release; Zenodo archives each release when its GitHub integration is enabled.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "occulta ${GITHUB_REF_NAME#v}" \
            --notes "See CHANGELOG.md for the changes in this version." --prerelease
